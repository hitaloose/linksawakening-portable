<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFX picker</title>
<style>
:root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --mute:#6b6a65; --line:#dcdad3; --acc:#2f6f4f; --sel:#e3efe7; --warn:#9a5b00; }
@media (prefers-color-scheme: dark) { :root { --bg:#161714; --panel:#1f201c; --ink:#ecebe6; --mute:#9d9c95; --line:#34352f; --acc:#7cc39c; --sel:#22352a; --warn:#e0a54a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:16px; margin:0 12px 0 0; }
button, label.btn { font:inherit; padding:5px 10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; cursor:pointer; }
button.primary { background:var(--acc); color:var(--bg); border-color:var(--acc); }
label.btn input { display:none; }
main { display:grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); height:calc(100vh - 58px); }
@media (max-width: 760px) { main { grid-template-columns:1fr; height:auto; } }
section { overflow:auto; border-right:1px solid var(--line); padding:8px 12px; }
input[type=search], select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); width:100%; margin-bottom:8px; }
table { width:100%; border-collapse:collapse; }
td { padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
tr.gb { cursor:pointer; }
tr.gb:hover td { background:var(--sel); }
tr.gb.on td { background:var(--sel); outline:1px solid var(--acc); }
.id { font-family:ui-monospace, monospace; color:var(--mute); white-space:nowrap; }
.src { font-family:ui-monospace, monospace; color:var(--acc); font-size:12px; }
.hint { color:var(--mute); font-size:12px; }
.files { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; }
.file { border:1px solid var(--line); border-radius:6px; padding:6px; background:var(--panel); }
.file.playing { outline:2px solid var(--acc); }
.file .n { font-family:ui-monospace, monospace; }
.file .d { color:var(--mute); font-size:12px; }
.file .used { color:var(--warn); font-size:11px; }
.file button { padding:2px 6px; margin-top:4px; font-size:12px; }
.status { color:var(--mute); font-size:12px; }
kbd { border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>SFX picker</h1>
  <label class="btn">Switch sfx folder… <input id="dir" type="file" webkitdirectory multiple></label>
  <label class="btn">Load sfx_map.csv… <input id="csvin" type="file" accept=".csv"></label>
  <button class="primary" id="save">Download sfx_map.csv</button>
  <span class="status" id="status"></span>
</header>
<main>
  <section>
    <input type="search" id="q" placeholder="Filter Game Boy sounds (name, id, note)…">
    <table><tbody id="gb"></tbody></table>
  </section>
  <section>
    <select id="bank"></select>
    <div class="status">Click a file to hear it. <kbd>↓</kbd>/<kbd>↑</kbd> next/previous, <kbd>Enter</kbd> assigns the playing file to the selected Game Boy sound, <kbd>Del</kbd> clears it.</div>
    <div class="files" id="files" style="margin-top:8px"></div>
  </section>
</main>

": "", "look_in": "BANK_SE_ENE_*", "note": ""}, {"kind": "noise", "id": "3B", "name": "NOISE_SFX_KIRBY_INHALE", "source": "", "look_in": "BANK_SE_ENE_*", "note": ""}, {"kind": "noise", "id": "3C", "name": "NOISE_SFX_UNKNOWN_3C", "source": "", "look_in": "", "note": "Unused?"}, {"kind": "noise", "id": "3D", "name": "NOISE_SFX_FINAL_BOSS_EXPLOSION", "source": "", "look_in": "BANK_SE_MAPOBJ", "note": ""}, {"kind": "noise", "id": "3E", "name": "NOISE_SFX_SLIME_EEL_FLOOR_BREAK", "source": "", "look_in": "BANK_SE_MAPOBJ", "note": ""}, {"kind": "noise", "id": "3F", "name": "NOISE_SFX_MINIBOSS_FLEE", "source": "", "look_in": "BANK_SE_ENE_*", "note": "Master Stalfos, Grim Creeper"}, {"kind": "noise", "id": "40", "name": "NOISE_SFX_PHOTO", "source": "", "look_in": "BANK_SE_SYSTEM", "note": "Photographer taking photo"}];
const KEY = "la-sfx-picker-v1";
let rows = ROWS.map(r => ({...r}));
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) for (const r of rows) { const k = r.kind + r.id; if (k in saved) r.source = saved[k]; } } catch (e) {}
let banks = {};           // bank -> [{name, file}]
let sel = null;           // selected row index
let cur = -1;             // playing file index in the current bank
const audio = new Audio();

function persist() {
  try { const o = {}; for (const r of rows) o[r.kind + r.id] = r.source; localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function usedBy(src) { return rows.filter(r => r.source === src).map(r => r.kind[0] + r.id); }

function renderGB() {
  const q = document.getElementById("q").value.toLowerCase();
  const tb = document.getElementById("gb");
  tb.innerHTML = "";
  rows.forEach((r, i) => {
    const text = (r.kind + " " + r.id + " " + r.name + " " + r.note + " " + r.source).toLowerCase();
    if (q && !text.includes(q)) return;
    const tr = document.createElement("tr");
    tr.className = "gb" + (i === sel ? " on" : "");
    tr.innerHTML = `<td class="id">${r.kind[0]}_${r.id}</td><td>${esc(r.name.replace(/^(JINGLE|WAVE_SFX|NOISE_SFX)_/, ""))}` +
      (r.note ? `<div class="hint">${esc(r.note)}</div>` : "") +
      `<div class="hint">look in: ${esc(r.look_in || "?")}</div></td><td class="src">${esc(r.source)}</td>`;
    tr.onclick = () => { sel = i; renderGB(); if (r.look_in && !r.look_in.includes("*")) pickBank(r.look_in); };
    tb.appendChild(tr);
  });
}

function pickBank(b) {
  if (!banks[b]) return;
  const s = document.getElementById("bank");
  s.value = b; renderFiles();
}

function renderFiles() {
  const b = document.getElementById("bank").value;
  const box = document.getElementById("files");
  box.innerHTML = "";
  (banks[b] || []).forEach((f, i) => {
    const src = `sfx:${b}/${f.name.replace(/\.ogg$/i, "")}`;
    const d = document.createElement("div");
    d.className = "file" + (i === cur ? " playing" : "");
    const u = usedBy(src);
    d.innerHTML = `<div class="n">${esc(f.name)}</div><div class="d">${f.dur ? f.dur.toFixed(2) + " s" : ""}</div>` +
      (u.length ? `<div class="used">used: ${u.join(", ")}</div>` : "") + `<button>assign</button>`;
    d.onclick = (e) => { if (e.target.tagName === "BUTTON") assign(src); else play(i); };
    box.appendChild(d);
  });
}

function play(i) {
  const b = document.getElementById("bank").value;
  const list = banks[b] || [];
  if (i < 0 || i >= list.length) return;
  cur = i;
  const f = list[i];
  if (!f.url) f.url = URL.createObjectURL(f.file);
  audio.src = f.url; audio.currentTime = 0; audio.play().catch(() => {});
  audio.onloadedmetadata = () => { f.dur = audio.duration; renderFiles(); };
  renderFiles();
}

function assign(src) {
  if (sel === null) { status("Select a Game Boy sound on the left first."); return; }
  rows[sel].source = src; persist(); renderGB(); renderFiles();
  status(`${rows[sel].kind[0]}_${rows[sel].id} = ${src}`);
}
function status(t) { document.getElementById("status").textContent = t; }

document.getElementById("dir").onchange = (e) => {
  banks = {};
  for (const f of e.target.files) {
    if (!/\.ogg$/i.test(f.name)) continue;
    const parts = f.webkitRelativePath.split("/");
    if (parts.length < 2) continue;
    const bank = parts[parts.length - 2];
    (banks[bank] = banks[bank] || []).push({ name: f.name, file: f });
  }
  const s = document.getElementById("bank");
  s.innerHTML = "";
  for (const b of Object.keys(banks).sort()) {
    banks[b].sort((x, y) => x.name.localeCompare(y.name));
    const o = document.createElement("option"); o.value = b; o.textContent = `${b} (${banks[b].length})`; s.appendChild(o);
  }
  cur = -1; renderFiles();
  status(`${Object.keys(banks).length} folders loaded`);
};
document.getElementById("bank").onchange = () => { cur = -1; renderFiles(); };
document.getElementById("q").oninput = renderGB;

function parseCSV(t) {
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.length > 1);
}
document.getElementById("csvin").onchange = async (e) => {
  const t = await e.target.files[0].text();
  const [head, ...data] = parseCSV(t);
  rows = data.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
  persist(); renderGB(); renderFiles(); status(`${rows.length} rows loaded`);
};
document.getElementById("save").onclick = () => {
  const cols = ["kind", "id", "name", "source", "look_in", "note"];
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => q(r[c] || "")).join(","))).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "sfx_map.csv"; a.click();
};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowDown") { e.preventDefault(); play(cur + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); play(cur - 1); }
  else if (e.key === "Enter" && cur >= 0) {
    const b = document.getElementById("bank").value;
    assign(`sfx:${b}/${banks[b][cur].name.replace(/\.ogg$/i, "")}`);
  } else if ((e.key === "Delete" || e.key === "Backspace") && sel !== null) { rows[sel].source = ""; persist(); renderGB(); }
});
renderGB();
